[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fermion-garden"
version = "0.1.0"
description = "Auditable and reversible context selection for multi-agent handoffs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "伴月之星"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.scripts]
fermion-garden-demo = "fermion_garden.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

