name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: fermion-garden-demo | python -m json.tool > /tmp/fermion-garden-output.json
      - run: cd evidence/round120 && sha256sum -c frozen-decision-table.sha256
